<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pista Studio</title>
  <script>
    // Redirige selon la langue du navigateur, français par défaut
    var lang = (navigator.language || "fr").toLowerCase();
    window.location.replace(lang.indexOf("en") === 0 ? "en/index.html" : "fr/index.html");
  </script>
  <meta http-equiv="refresh" content="0; url=fr/index.html">
</head>
<body>
  <p><a href="fr/index.html">Français</a> · <a href="en/index.html">English</a></p>
</body>
</html>
