<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pista Studio</title>
  <script>
    // Français si le navigateur est en français, anglais par défaut
    var lang = (navigator.language || "en").toLowerCase();
    window.location.replace(lang.indexOf("fr") === 0 ? "/fr/" : "/en/");
  </script>
  <meta http-equiv="refresh" content="0; url=/en/">
</head>
<body>
  <p><a href="/en/">English</a> · <a href="/fr/">Français</a></p>
</body>
</html>
